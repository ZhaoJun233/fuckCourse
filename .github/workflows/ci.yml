name: CI & Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

permissions:
  contents: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax
        run: |
          python -c "import py_compile, subprocess, sys; files = subprocess.check_output(['git', 'ls-files', '*.py']).decode('utf-8', 'ignore').splitlines(); errs = [f for f in files if f.endswith('.py') and not py_compile.compile(f, doraise=False)]; sys.exit(1 if errs else 0)"

      - name: Run unit and regression test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  build-exe:
    name: Build & Verify Windows EXE
    needs: test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file executable
        run: |
          pyinstaller --clean -y fuckCourse.spec

      - name: Smoke test built executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/fuckCourse.exe")) {
            throw "Executable dist/fuckCourse.exe was not generated!"
          }
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::InputEncoding  = [System.Text.Encoding]::UTF8
          "0" | ./dist/fuckCourse.exe
          Write-Host "Smoke test passed successfully."

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuckCourse-windows-x64
          path: dist/fuckCourse.exe
          if-no-files-found: error

      - name: Publish GitHub Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fuckCourse.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
